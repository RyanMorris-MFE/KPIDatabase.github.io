<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S13 KPI Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<style>
:root{--red:#e2232f;--bg:#0a0a0b;--card:#141416;--card2:#1b1b1e;--line:#2a2a2e;--ink:#f3f3f4;--mut:#8d8f96}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 Montserrat,"Segoe UI",system-ui,sans-serif;min-height:100vh}
.hd{--t:clamp(330px,60%,860px);position:relative;height:104px;background:#000}
.hd::before,.hd .band{content:"";position:absolute;inset:0}
.hd::before{background:#fff;clip-path:polygon(0 0,var(--t) 0,calc(var(--t) - 52px) 100%,0 100%)}
.hd .band{background:var(--red);clip-path:polygon(0 0,calc(var(--t) - 24px) 0,calc(var(--t) - 76px) calc(100% - 4px),0 calc(100% - 4px))}
.brand{position:absolute;left:clamp(16px,4vw,56px);top:50%;transform:translateY(-50%);z-index:2}
.brand h1{margin:0;font-size:clamp(22px,3.4vw,34px);font-weight:700;letter-spacing:.02em;line-height:1}
.brand p{margin:6px 0 0;font-size:11px;letter-spacing:.32em;font-weight:500;text-transform:uppercase}
.upbar{position:relative;margin-top:-104px;height:104px;display:flex;justify-content:flex-end;align-items:center;padding:0 clamp(14px,3vw,40px);pointer-events:none}
.up{pointer-events:auto;text-align:right}
@media(max-width:820px){.upbar{margin-top:0;height:auto;background:#000;justify-content:flex-start;padding:4px 16px 14px}.up{text-align:left}}
.btn{font:600 12px Montserrat,sans-serif;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--red);background:var(--red);color:#fff;padding:9px 16px;cursor:pointer;transition:.15s}
.btn:hover{background:#fff;color:var(--red);border-color:#fff}.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}.btn.ghost:hover{border-color:var(--red);color:#fff;background:transparent}
#stat{display:block;color:var(--mut);font-size:11px;margin-top:6px;max-width:300px}
.tabs{display:flex;gap:28px;padding:0 clamp(16px,4vw,56px);border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;color:var(--mut);font:600 12px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:16px 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:#fff;border-color:var(--red)}
.ctl{display:flex;flex-wrap:wrap;gap:16px 18px;align-items:flex-end;padding:18px clamp(16px,4vw,56px)}
.f{display:flex;flex-direction:column;gap:6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
select{font:500 13px Montserrat,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 28px 8px 10px;min-width:120px;max-width:260px;border-radius:0;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select:focus{outline:1px solid var(--red)}
.delta{background:var(--card);border:1px solid var(--line);padding:8px 14px;min-width:260px}
.delta .r{display:flex;align-items:center;gap:10px;margin-top:2px}
input[type=range]{flex:1;accent-color:var(--red)}output{color:#fff;font-size:13px;min-width:64px;text-align:right;letter-spacing:0;font-weight:600}
.chk{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink);font-weight:500;margin-top:4px;cursor:pointer}.chk input{accent-color:var(--red)}
.cnt{margin-left:auto;color:var(--mut);font-size:12px;align-self:center}.cnt b{color:#fff}
.pick{position:relative}
.pop{position:absolute;z-index:20;top:62px;left:0;width:min(560px,92vw);max-height:70vh;overflow:auto;background:var(--card2);border:1px solid var(--line);border-top:2px solid var(--red);padding:14px;box-shadow:0 20px 50px #000a}
.pop h4{margin:12px 0 6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.ms{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;min-width:130px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:8px 12px}.ms-pop{width:240px;max-height:50vh}.ms-pop label{display:flex;margin:5px 0;font-size:13px}.pop .acts{display:flex;gap:8px}.pop label{display:inline-flex;align-items:center;gap:5px;margin:3px 12px 3px 0;font-size:12px;cursor:pointer}.pop input{accent-color:var(--red)}
main{padding:0 clamp(16px,4vw,56px) 48px}
.wrap{overflow:auto;background:var(--card);border:1px solid var(--line);max-height:74vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;z-index:3;background:var(--card2);text-align:right;vertical-align:bottom;padding:10px 12px 9px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#d4d5d9;border-bottom:1px solid var(--line);min-width:96px;border-top:3px solid var(--g)}
thead th.first{text-align:left;left:0;z-index:5;min-width:170px;border-top-color:var(--red)}
td{padding:8px 12px;text-align:right;border-bottom:1px solid #1f1f22;white-space:nowrap;font-size:13px}
td.first{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;border-right:1px solid var(--line);color:#cfd0d4}
tr.ev td{background:#000;padding:12px;text-align:left;font-weight:700;letter-spacing:.08em;border-left:3px solid var(--red);border-bottom:1px solid var(--line)}
tr.ev td.first{background:#000}
tr.dr td,tr.ru td{background:#101012;text-align:left;padding:5px 12px;font-size:11px;letter-spacing:.1em;color:var(--mut);font-weight:600;border-bottom:1px solid #1a1a1d}
tr.dr td{color:#fff}tr.dr td.first,tr.ru td.first{background:#101012}tr.ru td{padding-left:26px}
tr.sq td.first{padding-left:40px;font-weight:500}
tr.sq:hover td,tr.sq:hover td.first{background:#1e1e22}
.pill{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:11px;padding:2px 8px;letter-spacing:.04em}
tr.avg td{position:sticky;bottom:0;background:#fff;color:#000;font-weight:700;border-top:2px solid var(--red);z-index:2}
tr.avg td.first{background:#fff;z-index:4;color:#000;text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding-left:12px}
.card{background:var(--card);border:1px solid var(--line);padding:16px}
.cc{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;margin-bottom:14px}
.zm{display:flex;align-items:center;gap:10px}.zm input{width:160px;flex:none}
#svg{overflow:auto}#svg svg{display:block}#svg text{fill:#8d8f96;font-size:11px;font-family:Montserrat,sans-serif}#svg text.at{fill:#d4d5d9;font-weight:600}#svg text.vl{fill:#fff;font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;color:#cfd0d4;font-size:11px}.leg i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:50%}
#cap{color:var(--mut);font-size:12px;margin-top:8px}
#tip{position:fixed;display:none;z-index:60;background:#fff;color:#000;padding:6px 10px;font-size:12px;font-weight:600;white-space:pre;pointer-events:none;border-left:3px solid var(--red)}
.hide{display:none!important}.empty{padding:50px;text-align:center;color:var(--mut)}
.drop{position:fixed;inset:0;background:#000d;border:3px dashed var(--red);z-index:50;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:700;letter-spacing:.1em}
</style></head><body>
<div class="hd"><div class="band"></div><div class="brand"><h1>S13 KPI</h1><p>Performance Dashboard</p></div></div>
<div class="upbar"><div class="up"><button class="btn" id="upb">Upload SQLite</button><span id="stat"></span></div></div>
<input type="file" id="file" accept=".sqlite,.sqlite3,.db" hidden>
<div class="drop" id="drop">DROP SQLITE FILE TO LOAD</div>
<div class="tabs"><button class="on" data-p="p1">KPI Summary</button><button data-p="p2">Charts</button></div>
<div class="ctl" id="ctl"></div>
<main>
<section id="p1"><div class="wrap"><table id="t1"></table></div></section>
<section id="p2" class="hide"><div class="card"><div class="cc" id="cc"></div><div id="svg"></div><div class="leg" id="leg"></div><div id="cap"></div></div></section>
</main>
<script>
/* >>> PASTE YOUR ORIGINAL "const EMBED=..." LINE HERE to keep the built-in offline snapshot. <<<
   (Left empty in this copy; the page still loads S13_KPI.sqlite or an uploaded .sqlite as normal.) */
const EMBED={"rows":[],"labels":{}};
const $=s=>document.querySelector(s);
let R=[],L={},COLS=[],NUM=[],FIL=[],DEC={},sel=new Set(),hasDelta=false,note='';
const st={f:{},maxDelta:null,fastest:false};
const BASEF=[['event','Session'],['driver','Driver'],['power_kw','Power Mode'],['aero_kit','Aero Config']];
const IDK=['id','_i','driver','event','run','sequence'];
const DEF=['delta_to_fastest','lap_time_s','power_kw','track_temp_degc','air_temp_degc','fa_tyre_carcass_start_p_degc','ra_tyre_carcass_start_p_degc','fa_ptyre_start_p_bar','ra_ptyre_start_p_bar','etyrefa_start_p_kj','etyrera_start_p_kj','etyrefa_start_p_wear','etyrera_start_p_wear'];
const GRP=[['Performance','#e2232f',k=>/^(lap_time|delta)/.test(k)],['Conditions & Config','#9a9ca3',k=>/^(aero|power|compound|track|air|session)/.test(k)],['Carcass Temp','#7fc15a',k=>/carcass/.test(k)],['Tyre Air Temp','#3ec6c1',k=>/ttyreair/.test(k)],['Pressure','#a58be0',k=>/ptyre/.test(k)],['Tyre Energy','#f5a25d',k=>/^etyre.*kj|^t_e|^etyre_bal/.test(k)],['Wear','#c0c4cc',k=>/wear/.test(k)],['TTM / Surface','#5b9bf0',k=>/ttm|surface/.test(k)]];
const grp=k=>GRP.find(g=>g[2](k))||['Other','#6f727a'];
const lab=k=>String((L[k]||k.replace(/_/g,' '))).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(v,d)=>typeof v!=='number'||isNaN(v)?'':v.toFixed(d);
const avg=(rs,k)=>{const a=rs.map(r=>r[k]).filter(v=>typeof v==='number');return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const uniq=k=>[...new Set(R.map(r=>r[k]).filter(v=>v!=null))].sort((a,b)=>a>b?1:-1);
const pretty=e=>String(e).replace(/^(S\d+_T\d+)(?!_)(.*)$/,'$1_$2');
const cmp=(x,y)=>String(x).localeCompare(String(y),undefined,{numeric:true});
const filtered=()=>R.filter(r=>FIL.every(([k])=>!st.f[k]||!st.f[k].size||st.f[k].has(String(r[k])))&&(st.maxDelta==null||typeof r.delta_to_fastest!=='number'||r.delta_to_fastest<=st.maxDelta+1e-9)&&(!st.fastest||(typeof r.delta_to_fastest==='number'&&Math.abs(r.delta_to_fastest)<1e-6)));

function load(rows0,labels){
  L=labels||{};note='';
  const keys=[...new Set(rows0.flatMap(r=>Object.keys(r)))];
  rows0.forEach(r=>keys.forEach(k=>{if(r[k]===''||r[k]===undefined)r[k]=null}));
  keys.forEach(k=>{const vs=rows0.map(r=>r[k]).filter(v=>v!=null);if(vs.length&&vs.every(v=>typeof v==='number'||(typeof v==='string'&&v.trim()!==''&&isFinite(v))))rows0.forEach(r=>{if(r[k]!=null)r[k]=+r[k]})});
  const has=k=>rows0.some(r=>r[k]!=null);
  const fil=BASEF.filter(([k])=>has(k));
  const isStr=k=>rows0.some(r=>typeof r[k]==='string');
  keys.forEach(k=>{if(!BASEF.some(b=>b[0]===k)&&!['id','run','sequence','event','driver','_i'].includes(k)&&isStr(k)){const n=new Set(rows0.map(r=>r[k]).filter(v=>v!=null)).size;if(n>=2&&n<=12)fil.push([k,lab(k)])}});
  FIL=fil;
  R=rows0.map((r,i)=>{const o={...r,_i:i};['event','driver','run'].forEach(e=>{if(o[e]==null)o[e]='—'});if(o.sequence==null)o.sequence='';return o});
  R.sort((a,b)=>cmp(a.event,b.event)||cmp(a.driver,b.driver)||cmp(a.run,b.run)||a._i-b._i);
  if(!keys.includes('delta_to_fastest')&&R.some(r=>typeof r.lap_time_s==='number')){
    const mn={};R.forEach(r=>{if(typeof r.lap_time_s==='number')mn[r.event]=Math.min(mn[r.event]??1e9,r.lap_time_s)});
    R.forEach(r=>{if(typeof r.lap_time_s==='number')r.delta_to_fastest=r.lap_time_s-mn[r.event]});
    L.delta_to_fastest='Delta to Fastest (calc.)';note=' · delta calculated per session';keys.push('delta_to_fastest');
  }
  COLS=keys.filter(k=>!IDK.includes(k));
  NUM=COLS.filter(k=>R.some(r=>typeof r[k]==='number')&&!R.some(r=>typeof r[k]==='string'));
  hasDelta=NUM.includes('delta_to_fastest');
  DEC={};NUM.forEach(k=>{let d=0;R.forEach(r=>{const v=r[k];if(typeof v==='number'){const s=(+v.toFixed(5)).toString(),i=s.indexOf('.');if(i>=0)d=Math.max(d,Math.min(3,s.length-i-1))}});
    DEC[k]=/^(lap_time|delta)/.test(k)?3:/ptyre/.test(k)?2:/^[a-z]{2}_tyre_carcass/.test(k)?1:/^etyre.*(kj|wear)/.test(k)?1:d});
  const d=DEF.filter(k=>COLS.includes(k));sel=new Set(d.length?d:COLS.slice(0,12));
  st.f={};st.maxDelta=null;st.fastest=false;
  buildCtl();buildChartCtl();render();
}
const maxD=()=>Math.max(0,Math.ceil(Math.max(0,...R.map(r=>+r.delta_to_fastest||0))*10)/10);
function buildCtl(){
  const M=hasDelta?maxD():0,cur=st.maxDelta==null?M:st.maxDelta;
  const vl=(k,v)=>k==='event'?pretty(v):k==='power_kw'?v+' kW':v;
  $('#ctl').innerHTML=FIL.map(([k,n])=>`<div class="f pick">${esc(n)}<button class="btn ghost ms" data-mk="${esc(k)}"></button><div class="pop ms-pop hide" data-pk="${esc(k)}"><div class="acts"><button class="btn ghost" data-clr="${esc(k)}">Clear (all)</button></div><div style="margin-top:8px">${uniq(k).map(v=>`<label><input type="checkbox" data-k="${esc(k)}" value="${esc(v)}" ${st.f[k]&&st.f[k].has(String(v))?'checked':''}>${esc(vl(k,v))}</label>`).join('')}</div></div></div>`).join('')+
  (hasDelta?`<div class="f delta">Delta to fastest ≤<div class="r"><input type="range" id="rng" min="0" max="${M||1}" step="0.05" value="${cur}"><output id="out">${cur.toFixed(2)} s</output></div><label class="chk"><input type="checkbox" id="fst" ${st.fastest?'checked':''}>Fastest laps only</label></div>`:'')+
  `<div class="f pick">Display<button class="btn ghost" id="colb">Columns (<span id="nc">${sel.size}</span>) ▾</button><div class="pop hide" id="pop"></div></div><button class="btn ghost" id="rst">Reset</button><span class="cnt" id="cnt"></span>`;
  const mlab=k=>{const x=st.f[k];if(!x||!x.size)return 'All ▾';const a=[...x].map(v=>vl(k,v));return (a.length<=2?a.join(', '):a.length+' selected')+' ▾'};
  const closeAll=ex=>document.querySelectorAll('.pop').forEach(p=>{if(p!==ex)p.classList.add('hide')});
  FIL.forEach(([k])=>{const b=document.querySelector(`[data-mk="${k}"]`),p=document.querySelector(`[data-pk="${k}"]`);if(!b)return;b.textContent=mlab(k);
    b.onclick=e=>{e.stopPropagation();closeAll(p);p.classList.toggle('hide')};p.onclick=e=>e.stopPropagation();
    p.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{const x=st.f[k]=st.f[k]||new Set();c.checked?x.add(c.value):x.delete(c.value);b.textContent=mlab(k);render()});
    p.querySelector('[data-clr]').onclick=()=>{st.f[k]=new Set();p.querySelectorAll('input').forEach(c=>c.checked=false);b.textContent=mlab(k);render()}});
  if(hasDelta){$('#rng').oninput=e=>{const v=+e.target.value;st.maxDelta=v>=M?null:v;$('#out').textContent=v.toFixed(2)+' s';render()};$('#fst').onchange=e=>{st.fastest=e.target.checked;render()}}
  $('#rst').onclick=()=>{st.f={};st.maxDelta=null;st.fastest=false;buildCtl();render()};
  $('#colb').onclick=e=>{e.stopPropagation();closeAll($('#pop'));$('#pop').classList.toggle('hide');buildPop()};
  $('#pop').onclick=e=>e.stopPropagation();
}
function buildPop(){
  const by={};COLS.forEach(k=>{const g=grp(k);(by[g[0]]=by[g[0]]||{c:g[1],k:[]}).k.push(k)});
  $('#pop').innerHTML=`<div class="acts"><button class="btn ghost" data-a="def">Default</button><button class="btn ghost" data-a="all">All</button><button class="btn ghost" data-a="none">None</button></div>`+
  Object.entries(by).map(([n,g])=>`<h4 style="color:${g.c}">${n}</h4>`+g.k.map(k=>`<label><input type="checkbox" data-c="${esc(k)}" ${sel.has(k)?'checked':''}>${esc(lab(k))}</label>`).join('')).join('');
  $('#pop').querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.c):sel.delete(c.dataset.c);render()});
  $('#pop').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;sel=new Set(a==='all'?COLS:a==='none'?[]:DEF.filter(k=>COLS.includes(k)));buildPop();render()});
}
document.addEventListener('click',()=>document.querySelectorAll('.pop').forEach(p=>p.classList.add('hide')));
function table(rs){
  const cols=COLS.filter(k=>sel.has(k)),n=cols.length+1;
  if(!rs.length||!cols.length){$('#t1').innerHTML=`<tbody><tr><td class="empty">${rs.length?'Choose columns to display':'No laps match these filters'}</td></tr></tbody>`;return}
  let h='<thead><tr><th class="first">Event – Lap</th>'+cols.map(k=>`<th style="--g:${grp(k)[1]}">${esc(lab(k))}</th>`).join('')+'</tr></thead><tbody>';
  let ev,dr,ru;
  rs.forEach(r=>{
    if(r.event!==ev){ev=r.event;dr=ru=null;h+=`<tr class="ev"><td class="first" colspan="${n}">${esc(pretty(ev))}</td></tr>`}
    if(r.driver!==dr){dr=r.driver;ru=null;h+=`<tr class="dr"><td class="first" colspan="${n}">${esc(dr)}</td></tr>`}
    if(r.run!==ru){ru=r.run;h+=`<tr class="ru"><td class="first" colspan="${n}">${esc(ru)}</td></tr>`}
    h+=`<tr class="sq"><td class="first">${esc(r.sequence)}</td>`+cols.map(k=>{const v=r[k];
      if(k==='delta_to_fastest'&&typeof v==='number'&&Math.abs(v)<1e-6)return `<td><span class="pill">0.000</span></td>`;
      return `<td>${typeof v==='number'?fmt(v,DEC[k]??0):esc(v??'')}</td>`}).join('')+'</tr>';
  });
  h+='<tr class="avg"><td class="first">Average</td>'+cols.map(k=>`<td>${fmt(avg(rs,k),k==='lap_time_s'?2:DEC[k]??0)}</td>`).join('')+'</tr></tbody>';
  $('#t1').innerHTML=h;
}
// ---------- charts
const PAL=['#e2232f','#f4f4f5','#f5a25d','#5b9bf0','#7fc15a','#a58be0','#3ec6c1','#e6d35a','#ff7eb6','#9a9ca3'];
const TYPES=[['scatter','Scatter (X vs Y)'],['bars','Bar per lap'],['line','Line over laps'],['avg','Average by group'],['hist','Distribution']];
function buildChartCtl(){
  if(!NUM.length){$('#cc').innerHTML='<div class="empty">No numeric channels found</div>';return}
  const no=NUM.map(k=>`<option value="${esc(k)}">${esc(lab(k))}</option>`).join('');
  $('#cc').innerHTML=`<div class="f">Chart<select id="ctype">${TYPES.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('')}</select></div><div class="f" id="fx">X axis<select id="cx">${no}</select></div><div class="f">Y / metric<select id="cy">${no}</select></div><div class="f" id="fc">Colour / group by<select id="cb"><option value="">None</option>${FIL.map(([k,n])=>`<option value="${esc(k)}">${esc(n)}</option>`).join('')}</select></div><div class="f">Chart size<div class="zm"><input type="range" id="czoom" min="30" max="150" step="5" value="70"><output id="czo">70%</output></div></div><label class="chk" id="ftr"><input type="checkbox" id="ctr" checked>Trend line</label>`;
  const y=NUM.includes('lap_time_s')?'lap_time_s':NUM[0];
  $('#cy').value=y;$('#cx').value=['fa_ptyre_start_p_bar','track_temp_degc'].find(k=>NUM.includes(k)&&k!==y)||NUM.find(k=>k!==y)||y;
  if(FIL.some(f=>f[0]==='driver'))$('#cb').value='driver';
  document.querySelectorAll('#cc select,#cc input').forEach(e=>{e.onchange=renderChart;if(e.id==='czoom')e.oninput=renderChart});
}
